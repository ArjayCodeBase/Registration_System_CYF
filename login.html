<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CYF Registration System</title>

    <meta
        name="description"
        content="CYF Registration System Staff Login"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #071a3d,
                    #0b2d63
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        /* ==================================================
           LOGIN CONTAINER
        ================================================== */

        .login-container {

            width: 100%;

            max-width: 430px;

        }


        /* ==================================================
           BRAND
        ================================================== */

        .brand {

            text-align: center;

            color: white;

            margin-bottom: 25px;

        }

        .logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            border-radius: 18px;

            background: #f4c542;

            color: #071a3d;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;

            font-weight: 800;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);

        }

        .brand h1 {

            font-size: 24px;

            margin-bottom: 6px;

        }

        .brand p {

            font-size: 14px;

            opacity: 0.8;

        }


        /* ==================================================
           LOGIN CARD
        ================================================== */

        .login-card {

            background: white;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

        }

        .login-card h2 {

            color: #071a3d;

            font-size: 26px;

            margin-bottom: 8px;

        }

        .login-description {

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 28px;

            line-height: 1.5;

        }


        /* ==================================================
           FORM
        ================================================== */

        .form-group {

            margin-bottom: 20px;

        }

        .form-group label {

            display: block;

            color: #1f2937;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 8px;

        }

        .input-wrapper {

            position: relative;

        }

        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #718096;

            font-size: 18px;

        }

        .form-input {

            width: 100%;

            height: 50px;

            border: 1px solid #d8dee9;

            border-radius: 11px;

            padding:
                0 45px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }

        .form-input:focus {

            border-color: #0b4aa2;

            box-shadow:
                0 0 0 3px
                rgba(11, 74, 162, 0.10);

        }


        /* ==================================================
           PASSWORD TOGGLE
        ================================================== */

        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            color: #718096;

            font-size: 17px;

        }


        /* ==================================================
           LOGIN BUTTON
        ================================================== */

        .login-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 11px;

            background: #0b4aa2;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }

        .login-button:hover {

            background: #083b84;

        }

        .login-button:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        /* ==================================================
           ERROR / SUCCESS
        ================================================== */

        .message {

            display: none;

            padding: 12px 14px;

            border-radius: 9px;

            margin-bottom: 18px;

            font-size: 13px;

            line-height: 1.4;

        }

        .message.error {

            display: block;

            background: #fff0f0;

            color: #b42318;

            border: 1px solid #f5c2c0;

        }

        .message.success {

            display: block;

            background: #eefbf3;

            color: #18794e;

            border: 1px solid #b7e4c7;

        }


        /* ==================================================
           FOOTER
        ================================================== */

        .back-home {

            text-align: center;

            margin-top: 20px;

        }

        .back-home a {

            color: white;

            text-decoration: none;

            font-size: 14px;

            opacity: 0.85;

        }

        .back-home a:hover {

            opacity: 1;

            text-decoration: underline;

        }


        .copyright {

            text-align: center;

            color: rgba(255,255,255,0.6);

            font-size: 12px;

            margin-top: 18px;

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }

            .login-card {

                padding: 25px 20px;

                border-radius: 18px;

            }

            .brand h1 {

                font-size: 21px;

            }

            .login-card h2 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- ==================================================
         BRAND
    ================================================== -->

    <div class="brand">

        <div class="logo">
            CYF
        </div>

        <h1>
            CYF Registration System
        </h1>

        <p>
            Login Management Portal
        </p>

    </div>


    <!-- ==================================================
         LOGIN CARD
    ================================================== -->

    <div class="login-card">

        <h2>
            Welcome Back User
        </h2>

        <p class="login-description">
            Sign in to access the system dashboard.
        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- ==================================================
             LOGIN FORM
        ================================================== -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign In
            </button>


        </form>

    </div>


    <!-- ==================================================
         BACK HOME
    ================================================== -->

    <div class="back-home">

        <a href="home.html">
            ← Back to Home
        </a>

    </div>

    <div class="copyright">

        © 2026 CYF Registration System

    </div>


</div>


<script>

/* ======================================================
   FASTAPI SERVER
====================================================== */

const API_URL =
    "http://127.0.0.1:8000";


/* ======================================================
   ELEMENTS
====================================================== */

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");


/* ======================================================
   SHOW MESSAGE
====================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* ======================================================
   PASSWORD SHOW / HIDE
====================================================== */

togglePassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "🙈";

        }

        else {

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "👁";

        }

    }
);


/* ======================================================
   LOGIN
====================================================== */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        /* -----------------------------------------------
           GET LOGIN VALUES
        ----------------------------------------------- */

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        /* -----------------------------------------------
           VALIDATE
        ----------------------------------------------- */

        if (
            !username ||
            !password
        ) {

            showMessage(
                "Please enter your username and password.",
                "error"
            );

            return;

        }


        /* -----------------------------------------------
           LOADING STATE
        ----------------------------------------------- */

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Signing in...";

        message.className =
            "message";


        try {


            /* -------------------------------------------
               SEND LOGIN REQUEST TO FASTAPI
            ------------------------------------------- */

            const response =
                await fetch(
                    API_URL +
                    "/auth_login_user",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                    }
                );


            /* -------------------------------------------
               READ SERVER RESPONSE
            ------------------------------------------- */

            const data =
                await response.json();


            console.log(
                "FastAPI login response:",
                data
            );


            /* -------------------------------------------
               LOGIN FAILED
            ------------------------------------------- */

            if (
                !response.ok
            ) {

                throw new Error(
                    data.detail ||
                    "Invalid username or password."
                );

            }


            /* -------------------------------------------
               LOGIN SUCCESS
            ------------------------------------------- */

            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            /* -------------------------------------------
               RESET LOGOUT STATUS
               
               IMPORTANT:
               If the user previously logged out,
               auth.js may have set:

                   loggedOut = true

               Remove it here after successful login
               so the user can access the dashboard
               normally again.
            ------------------------------------------- */

            sessionStorage.removeItem(
                "loggedOut"
            );


            /* -------------------------------------------
               SAVE LOGIN INFORMATION
            ------------------------------------------- */

            localStorage.setItem(
                "cyf_username",
                data.username
            );

            localStorage.setItem(
                "cyf_fullname",
                data.fullname
            );

            localStorage.setItem(
                "cyf_role",
                data.role
            );


            /* -------------------------------------------
               REDIRECT BASED ON ROLE
            ------------------------------------------- */

            setTimeout(
                function () {


                    /* -----------------------------------
                       ADMIN
                    ----------------------------------- */

                    if (
                        data.role ===
                        "Admin"
                    ) {

                        window.location.replace(
                            "admin_dashboard.html"
                        );

                    }


                    /* -----------------------------------
                       REGISTRATION TEAM
                    ----------------------------------- */

                    else if (
                        data.role ===
                        "Registration Team"
                    ) {

                        window.location.replace(
                            "registration_dashboard.html"
                        );

                    }


                    /* -----------------------------------
                       UNKNOWN ROLE
                    ----------------------------------- */

                    else {

                        showMessage(
                            "Invalid account role.",
                            "error"
                        );

                    }

                },
                700
            );


        }


        /* ==================================================
           LOGIN ERROR
        ================================================== */

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            /* -------------------------------------------
               CONNECTION ERROR
            ------------------------------------------- */

            if (
                error instanceof
                TypeError
            ) {

                showMessage(
                    "Could not connect to the registration server. Make sure FastAPI is running on http://127.0.0.1:8000.",
                    "error"
                );

            }

            else {

                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        /* -----------------------------------------------
           RESTORE BUTTON
        ----------------------------------------------- */

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Sign In";

    }
);

</script>


</body>

</html>
